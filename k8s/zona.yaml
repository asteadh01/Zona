# Zona on the home k3s cluster, following ObsidianVault/shared/patterns/deploy-blueprint.
#
# You don't apply this by hand: .github/workflows/deploy.yml does it on every push to main. It swaps
# ghcr.io/OWNER/zona:latest for the image built from that exact commit, stamps the run id on the pod
# template, and creates the zona-secrets Secret from the repo secrets first. Setup: docs/PHONE_SETUP.md.
#
# The public hostname (e.g. zona.steaddev.cl) is a route on the existing Cloudflare Tunnel that SportCove's
# cloudflared already runs, pointing at http://zona.zona.svc.cluster.local:80.
apiVersion: v1
kind: Namespace
metadata:
  name: zona
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: zona-data
  namespace: zona
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zona
  namespace: zona
  labels:
    app: zona
spec:
  # Exactly one: SQLite on a ReadWriteOnce volume, and one sync loop so nudges go out once.
  replicas: 1
  revisionHistoryLimit: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: zona
  template:
    metadata:
      labels:
        app: zona
      annotations:
        zona.deploy/run: "manual"  # the deploy workflow replaces this with its run id
    spec:
      automountServiceAccountToken: false  # Zona never talks to the Kubernetes API
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: zona
          image: ghcr.io/OWNER/zona:latest
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: zona-secrets
          env:
            - name: ZONA_TZ
              value: America/Santiago
            - name: ZONA_SECURE_COOKIES
              value: "1"
          readinessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 20
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests: { cpu: 50m, memory: 96Mi }
            limits: { cpu: 500m, memory: 384Mi }
          volumeMounts:
            - { name: data, mountPath: /data }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: zona-data
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: zona
  namespace: zona
spec:
  selector:
    app: zona
  ports:
    - port: 80
      targetPort: 8000
