name: 🧪 Tests

# Every push and pull request: the server's suite twice, on SQLite and on the Firestore emulator, and the app's typecheck and tests.
# Deploying is `scripts/zona_cloud.py deploy` from your PC (docs/PHONE_SETUP.md), so no cloud credentials live here.
on:
  push:
  pull_request:

jobs:
  test:
    name: 🧪 pytest (SQLite + Firestore emulator)
    runs-on: ubuntu-latest
    steps:
      - name: 📦 Checkout
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: ☕ Java for the emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: 🟩 Node for the Firebase CLI
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 📥 Install
        run: pip install -r requirements-dev.txt

      - name: 🧪 pytest
        run: npx --yes firebase-tools@15 emulators:exec --only firestore --project demo-zona "python -m pytest -p no:warnings"

  app:
    name: 📱 Expo app (typecheck + jest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: 📦 Checkout
        uses: actions/checkout@v4

      - name: 🟩 Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: 📥 Install
        run: npm ci

      - name: 🔎 Typecheck
        run: npm run typecheck

      - name: 🧪 Jest
        run: npm test
